<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Outreach · Solomon — Urban Ponics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #0f0f1a;
      --bg-card: #12121f;
      --bg-card-hover: #16162a;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text-primary: #f0f0ff;
      --text-secondary: #a0a0c0;
      --text-muted: #606080;
      --gold: #d4af37;
      --gold-glow: rgba(212,175,55,0.15);
      --green: #10b981;
      --indigo: #818cf8;
      --indigo-bg: rgba(99,102,241,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover { border-color: var(--border-hover); color: var(--text-primary); background: rgba(255,255,255,0.04); }
    .page-title { font-size: 18px; font-weight: 700; color: var(--indigo); }
    .page-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.3);
      color: var(--indigo);
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--indigo);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Main content ── */
    .main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* ── Stats cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2,1fr); } }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: var(--border-hover); }
    .stat-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 28px; font-weight: 800; line-height: 1; }
    .stat-value.blue   { color: var(--indigo); }
    .stat-value.green  { color: var(--green); }
    .stat-value.gold   { color: var(--gold); }
    .stat-value.purple { color: #a78bfa; }

    /* ── Table card ── */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .table-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .table-header h2 { font-size: 15px; font-weight: 700; color: var(--indigo); }
    .table-header p  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      padding: 10px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.15s;
    }
    tbody tr:hover { background: rgba(255,255,255,0.025); }
    tbody tr:last-child { border-bottom: none; }
    tbody td {
      padding: 12px 16px;
      font-size: 13px;
      vertical-align: middle;
    }

    .name-cell { font-weight: 600; color: var(--text-primary); }
    .company-cell { color: var(--text-secondary); }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .response-cell { font-size: 12px; font-weight: 600; }
    .channel-cell  { font-size: 11px; color: var(--text-muted); }

    .loading-row td { text-align: center; color: var(--text-muted); padding: 3rem; font-size: 14px; }
    .error-row td   { text-align: center; color: #ef4444; padding: 3rem; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="back-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Dashboard
      </a>
      <div>
        <div class="page-title">Email Outreach · Solomon</div>
        <div class="page-subtitle" id="pageSubtitle">Cargando...</div>
      </div>
    </div>
    <div class="live-badge">
      <span class="live-dot"></span>LIVE
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(99,102,241,0.12);">
          <svg width="18" height="18" fill="none" stroke="#818cf8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div class="stat-label">Enviados</div>
        <div class="stat-value blue" id="sol-sent">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(16,185,129,0.12);">
          <svg width="18" height="18" fill="none" stroke="#10b981" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
          </svg>
        </div>
        <div class="stat-label">Respondieron</div>
        <div class="stat-value green" id="sol-responded">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(212,175,55,0.12);">
          <svg width="18" height="18" fill="none" stroke="#d4af37" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <div class="stat-label">Interesados</div>
        <div class="stat-value gold" id="sol-interested">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(167,139,250,0.12);">
          <svg width="18" height="18" fill="none" stroke="#a78bfa" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
        </div>
        <div class="stat-label">Tasa Respuesta</div>
        <div class="stat-value purple" id="sol-rate">—</div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header">
        <div>
          <h2>Contactos</h2>
          <p id="tableSubtitle">Cargando datos...</p>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Empresa</th>
              <th>Estado</th>
              <th>Respuesta</th>
              <th>Canal</th>
            </tr>
          </thead>
          <tbody id="solomonTableBody">
            <tr class="loading-row"><td colspan="5">Cargando contactos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL     = 'https://mwbkrkoeltsbkbguoemo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13Ymtya29lbHRzYmtiZ3VvZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4OTg5MzMsImV4cCI6MjA4NjQ3NDkzM30.3DrznzqfbNP3RPYOGcj5uXiqPsSzFnWc5AoKyLk0OS8';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    const STATUS_LABEL = {
      'responded': { text: 'Respondió', color: '#10b981', bg: 'rgba(16,185,129,0.12)' },
      'paused':    { text: 'Pausado',   color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },
      'positive':  { text: 'Positivo',  color: '#d4af37', bg: 'rgba(212,175,55,0.12)' },
      'meeting':   { text: 'Reunión',   color: '#818cf8', bg: 'rgba(99,102,241,0.12)' },
    };
    const RESPONSE_LABEL = {
      'interested':     { text: '✓ Interesado',    color: '#10b981' },
      'not_interested': { text: '✗ No interesado', color: '#ef4444' },
    };

    async function load() {
      try {
        const { data, error } = await db
          .from('leads')
          .select('first_name, last_name, company, status, response_type, campaign')
          .eq('source', 'solomon_email')
          .order('company', { ascending: true });

        if (error) throw error;

        const total      = data.length;
        const responded  = data.filter(l => l.status === 'responded' || l.status === 'paused').length;
        const interested = data.filter(l => l.response_type === 'interested').length;
        const rate       = total > 0 ? Math.round((responded / total) * 100) : 0;

        document.getElementById('sol-sent').textContent      = total;
        document.getElementById('sol-responded').textContent  = responded;
        document.getElementById('sol-interested').textContent = interested;
        document.getElementById('sol-rate').textContent       = rate + '%';

        const subtitle = `${total} contactos · ${interested} interesados · ${rate}% tasa de respuesta`;
        document.getElementById('pageSubtitle').textContent  = subtitle;
        document.getElementById('tableSubtitle').textContent = subtitle;

        const tbody = document.getElementById('solomonTableBody');
        if (data.length === 0) {
          tbody.innerHTML = '<tr class="loading-row"><td colspan="5">No hay contactos registrados</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(l => {
          const s    = STATUS_LABEL[l.status]        || { text: l.status || '—',        color: '#606080', bg: 'rgba(255,255,255,0.05)' };
          const r    = RESPONSE_LABEL[l.response_type] || { text: l.response_type || '—', color: '#606080' };
          const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || '—';
          return `<tr>
            <td class="name-cell">${esc(name)}</td>
            <td class="company-cell">${esc(l.company) || '—'}</td>
            <td><span class="badge" style="background:${s.bg}; color:${s.color};">${s.text}</span></td>
            <td class="response-cell" style="color:${r.color};">${r.text}</td>
            <td class="channel-cell">Email · Solomon</td>
          </tr>`;
        }).join('');

      } catch (err) {
        console.error('Error:', err);
        document.getElementById('pageSubtitle').textContent = 'Error al cargar datos';
        document.getElementById('solomonTableBody').innerHTML =
          '<tr class="error-row"><td colspan="5">Error al cargar datos. Verifica la conexión.</td></tr>';
      }
    }

    load();
  </script>
</body>
</html>
